; =============================================================================
; Lyra 全量 GameplayTag 合并表 (UE 5.5 / LyraStarterGame)
; -----------------------------------------------------------------------------
; 合并来源:
;   1. Config/DefaultGameplayTags.ini
;   2. Plugins/GameFeatures/ShooterCore/Config/Tags/ShooterCoreTags.ini
;   3. Plugins/GameFeatures/ShooterExplorer/Config/Tags/ShooterExplorerTags.ini
;   4. Plugins/GameFeatures/TopDownArena/Config/Tags/TopDownArenaTags.ini
;   5. Plugins/GameSubtitles/Config/Tags/PluginTags.ini
;   6. Content/ContextEffects/DT_AnimEffectTags + DT_SurfaceTypes (DataTable 内的标签)
;   7. C++ 原生标签 (UE_DEFINE_GAMEPLAY_TAG / _STATIC / _COMMENT)
;
; 用法: 直接拷贝为「新工程 /Config/DefaultGameplayTags.ini」。
; 注意:
;   * 第 6 项的 DataTable 标签已展开写入下方 GameplayTagList，因此
;     GameplayTagTableList 两行默认注释掉；若新工程也会拷贝这两个 DataTable,
;     请取消注释（重复定义不冲突，但没必要）。
;   * 第 7 项的 C++ 原生标签若也随代码一起移植，可由下方
;     「C++ 原生标签」区块整段删除，二者重复但不冲突。
; =============================================================================

[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
WarnOnInvalidTags=True
FastReplication=True
InvalidTagCharacters="\"\',"
;+GameplayTagTableList=/Game/ContextEffects/DT_AnimEffectTags.DT_AnimEffectTags
;+GameplayTagTableList=/Game/ContextEffects/DT_SurfaceTypes.DT_SurfaceTypes
NumBitsForContainerSize=6
NetIndexFirstBitSegment=16

