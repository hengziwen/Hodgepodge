; =============================================================================
; Hodgepodge GameplayTag 注册表
; -----------------------------------------------------------------------------
; 由 LyraStarterGame (UE 5.5) 的 GameplayTag 全量对照表迁移而来，共 286 条。
; 迁移规则：原 Lyra.* 命名空间整体重命名为 Hodge.*，其余标签保持原名。
; 说明：
;   1. 本文件只登记非原生标签；由 UE_DEFINE_GAMEPLAY_TAG 注册的标签见
;      Source/Hodgepodge/Private/AbilitySystem/HodgeGameplayTags.cpp
;      （另有 HodgeHealthSet.cpp、HodgeGameplayAbility.cpp 等处的局部注册）。
;   2. 原表中的 DataTable 标签（DT_AnimEffectTags / DT_SurfaceTypes）已展开到下方，
;      故 GameplayTagTableList 暂作注释；日后拷贝同名 DataTable 再取消注释。
;   3. Explorer.* / TopDownArena.* / Subtitle.* 等来自尚未移植的 Lyra 插件，
;      此处只登记标签，不代表对应系统已经实现。
; =============================================================================

[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
WarnOnInvalidTags=True
ClearInvalidTags=False
AllowEditorTagUnloading=True
AllowGameTagUnloading=False
FastReplication=False
bDynamicReplication=False
InvalidTagCharacters="\"\',"
NumBitsForContainerSize=6
NetIndexFirstBitSegment=16
;+GameplayTagTableList=/Game/ContextEffects/DT_AnimEffectTags.DT_AnimEffectTags
;+GameplayTagTableList=/Game/ContextEffects/DT_SurfaceTypes.DT_SurfaceTypes

